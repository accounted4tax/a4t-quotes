<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Your quote · Accounted4Tax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css?v=11">
  <style>
    body { background: #E9ECF2; }
    .doc { max-width: 760px; margin: 0 auto; background: #fff; min-height: 100vh; box-shadow: 0 0 0 1px rgba(20,33,61,.04), 0 10px 40px rgba(20,33,61,.08); }
    @media (min-width: 800px) { .doc { margin: 24px auto; min-height: 0; border-radius: 6px; overflow: hidden; } }
    .hd { background: var(--navy); color: #fff; padding: 22px 20px; display: flex; flex-wrap: wrap; gap: 14px 24px; justify-content: space-between; align-items: flex-start; }
    .hd .brand { font: 700 1.55rem var(--font-head); line-height: 1.1; }
    .hd .tag { font-size: .82rem; color: #D5DAE5; margin-top: 6px; }
    .hd .addr { font-size: .8rem; color: #D5DAE5; line-height: 1.55; }
    @media (min-width: 560px) { .hd .addr { text-align: right; } }
    .hd .addr a { color: #fff; text-decoration: none; }
    .body { padding: 22px 20px 28px; }
    .title { font: 700 1.9rem var(--font-head); color: var(--navy); margin: 0 0 14px; letter-spacing: .02em; }
    .meta { background: #F1F3F7; padding: 14px 16px; display: grid; gap: 12px; font-size: .9rem; color: var(--navy); }
    @media (min-width: 560px) { .meta { grid-template-columns: 1fr 1fr; } }
    .meta b { font-weight: 700; }
    .meta div div { line-height: 1.5; }
    .sec { margin-top: 22px; }
    .sec h2 { font: 700 1.02rem var(--font-body); color: var(--navy); margin: 0 0 4px; }
    .sec .sub { font-size: .82rem; color: var(--muted); margin: -2px 0 6px; }
    .row { display: flex; justify-content: space-between; gap: 14px; padding: 9px 10px 9px 6px; border-bottom: 1px solid #E3E6EC; font-size: .9rem; color: #2a3346; }
    .row .d { flex: 1; min-width: 0; }
    .row .d small { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
    .row .a { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
    .row .a s { display: block; color: var(--muted); font-size: .76rem; }
    .row.tot { background: #F1F3F7; font-weight: 600; color: var(--navy); border-bottom: 0; }
    .row.tot + .row.tot { border-top: 1px solid #E3E6EC; }
    .band { background: var(--teal); color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 14px; margin-top: 10px; font-weight: 700; }
    .band .a { font: 700 1.25rem var(--font-body); white-space: nowrap; }
    .band.alt { background: var(--navy); }
    .band small { display: block; font-weight: 400; font-size: .78rem; opacity: .85; margin-top: 2px; }
    .choice { display: grid; gap: 10px; margin-top: 10px; }
    @media (min-width: 560px) { .choice { grid-template-columns: 1fr 1fr; } }
    .opt { display: flex; gap: 12px; align-items: flex-start; border: 2px solid #DCE0E8; border-radius: 10px; padding: 12px 14px; cursor: pointer; background: #fff; text-align: left; font: inherit; color: inherit; width: 100%; }
    .opt.on { border-color: var(--teal); background: #F4FAF9; }
    .opt .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #C7CDD8; flex: 0 0 20px; margin-top: 2px; }
    .opt.on .radio { border: 6px solid var(--teal); }
    .opt b { color: var(--navy); display: block; }
    .opt .big { font: 700 1.15rem var(--font-body); color: var(--navy); margin: 3px 0 2px; }
    .opt small { color: var(--muted); display: block; font-size: .8rem; }
    .msg { white-space: pre-line; font-size: .92rem; color: #2a3346; }
    .notes { margin: 6px 0 0; padding-left: 18px; font-size: .86rem; color: #2a3346; }
    .notes li { margin: 5px 0; }
    .accept { text-align: center; margin-top: 22px; }
    .accept .btn { min-width: 240px; }
    .accept p { font-size: .8rem; color: var(--muted); margin: 8px 0 0; }
    .ft { border-top: 1px solid #E3E6EC; padding: 14px 20px 20px; font-size: .72rem; color: var(--muted); text-align: center; line-height: 1.6; }
    .state { text-align: center; padding: 30px 6px; }
    .preview-bar { background: var(--gold); color: var(--navy); text-align: center; font-weight: 600; font-size: .85rem; padding: 8px 12px; }
    @media print { body { background: #fff; } .doc { box-shadow: none; margin: 0; } .preview-bar, .choice, .accept { display: none; } .band, .hd, .row.tot, .meta { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style>
</head>
<body>
  <div id="pv"></div>
  <div class="doc">
    <header class="hd">
      <div><div class="brand">Accounted4Tax</div><div class="tag" id="tag">Accountants for sole traders, contractors and limited companies</div></div>
      <div class="addr" id="addr">Accounted4Tax Ltd<br>128 City Road, London EC1V 2NX<br>info@accounted4tax.co.uk</div>
    </header>
    <main class="body" id="main"><p>Loading your quote…</p></main>
    <footer class="ft" id="ft">Accounted4Tax Ltd · Registered in England and Wales · Not VAT registered</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=11"></script>
  <script>
  (async function () {
    const cfg = window.A4T_CONFIG;
    const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: false } });
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = (n) => new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' }).format(Number(n || 0));
    const fd = (d) => d ? new Date(String(d).length === 10 ? d + 'T00:00:00' : d).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
    const r2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
    const down = (v, n) => Math.floor(r2(v * 100 / n)) / 100;
    const $ = (id) => document.getElementById(id);
    const p = new URLSearchParams(location.search);
    const token = p.get('t'), preview = p.get('preview') === '1';

    function state(title, text) {
      $('main').innerHTML = `<div class="state"><h1 class="title" style="font-size:1.4rem">${esc(title)}</h1><p>${text}</p><p style="margin-top:12px">Questions? Email <a href="mailto:info@accounted4tax.co.uk">info@accounted4tax.co.uk</a></p></div>`;
    }
    if (!token) return state('Quote not found', 'This link is incomplete. Please use the link in your email.');

    let d;
    try {
      const res = await sb.functions.invoke('quote-public', { body: { token, preview } });
      if (res.error) {
        let m = 'This quote link is not valid.';
        try { const b = await res.error.context.json(); if (b.error) m = b.error.message; } catch (_) {}
        return state('Quote unavailable', esc(m));
      }
      d = res.data;
    } catch (e) { return state('Something went wrong', 'Please try again in a moment.'); }

    const q = d.quote, L = d.lines, pr = d.practice || {}, c = d.client;
    const phone = pr.phone || '', email = pr.email || 'info@accounted4tax.co.uk';
    if (d.preview) $('pv').innerHTML = '<div class="preview-bar">Preview: this is what your client sees. Opening it here does not mark it as viewed.</div>';
    document.title = `Quote ${q.quote_number} · Accounted4Tax`;
    if (pr.tagline) $('tag').textContent = pr.tagline;
    $('addr').innerHTML = `${esc(pr.name || 'Accounted4Tax Ltd')}<br>${esc(pr.registered_office || '')}<br><a href="mailto:${esc(email)}">${esc(email)}</a>${phone ? ` · <a href="tel:${esc(phone.replace(/\s/g, ''))}">${esc(phone)}</a>` : ''}`;
    $('ft').textContent = `${pr.name || 'Accounted4Tax Ltd'} · Registered in England and Wales, company number ${pr.crn || ''} · Registered office ${pr.registered_office || ''} · Not VAT registered`;

    if (q.status === 'expired') return state('This quote has expired', `Quote ${esc(q.quote_number)} was valid until ${esc(fd(q.expires_at))}. Please contact us and we will send you an updated quote.`);
    if (q.status === 'declined') return state('Quote declined', `Quote ${esc(q.quote_number)} was declined. If you have changed your mind, please contact us.`);

    // ---------- group the lines like the printed quote ----------
    const grp = (l) => l.kind === 'deposit_balance' ? 'sa' : l.kind === 'one_off' ? 'catch_up' : l.rolling ? 'rolling' : (l.price_period === 'monthly' ? 'monthly' : 'year_end');
    const G = { catch_up: [], sa: [], year_end: [], monthly: [], rolling: [] };
    L.forEach(l => G[grp(l)].push(l));
    const sum = (arr, f) => r2(arr.reduce((a, x) => a + Number(f(x) || 0), 0));
    const perMonth = (l) => l.months ? r2(Number(l.total) / l.months) : Number(l.total);

    // Which year the work is for (same rules as the PDF): catch-up from the period labels, year-end from the year end
    const periodDate = (t) => { const m = String(t || '').match(/year (?:ended|ending)\s+(.+)$/i); return m ? m[1].trim() : null; };
    const andList = (a) => a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
    function catchHead(lines) {
      const dates = [...new Set(lines.map(l => periodDate(l.period_label)).filter(Boolean))];
      if (!dates.length) return { suffix: '', hide: false };
      return { suffix: dates.length === 1 ? ` – for the year ended ${dates[0]}` : ` – for the years ended ${andList(dates)}`,
        hide: dates.length === 1 && lines.every(l => !l.period_label || periodDate(l.period_label) === dates[0]) };
    }
    function yeHead() {
      if (!q.year_end_date) return '';
      if (c.client_type === 'ltd') return ` – for the year ending ${fd(q.year_end_date)}`;
      const y = Number(String(q.year_end_date).slice(0, 4));
      return ` – for the tax year ${y - 1}/${String(y).slice(-2)} (to ${fd(q.year_end_date)})`;
    }
    let hidePeriod = false;
    const label = (l) => {
      let t = esc(l.description) + (l.is_earlier_year ? ' catch-up' : '');
      if (l.about) t += ` – ${esc(l.about)}`;
      const extra = [];
      if (l.period_label && !(hidePeriod && l.kind === 'one_off' && periodDate(l.period_label))) extra.push(l.period_label);
      if (l.pricing_type === 'income_based' && l.quantity !== null) extra.push('based on estimated income of ' + money(l.quantity));
      else if (l.pricing_type !== 'fixed' && l.quantity !== null) extra.push(`${Number(l.quantity)} ${l.unit_label || ''}`.trim());
      if (l.price_period === 'monthly' && l.kind !== 'ongoing' && l.months) extra.push(`${l.months} × ${money(l.unit_price)}`);
      return t + (extra.length ? ` (${esc(extra.join(', '))})` : '');
    };
    const amt = (val, gross, suffix = '') => `<div class="a">${money(val)}${suffix}${Number(gross) > Number(val) + 0.004 ? `<s>${money(gross)}${suffix}</s>` : ''}</div>`;
    const row = (l, val, gross, suffix, note) => `<div class="row"><div class="d">${label(l)}${note ? `<small>${note}</small>` : ''}</div>${amt(val, gross, suffix)}</div>`;
    const tot = (t, val) => `<div class="row tot"><div class="d">${t}</div><div class="a">${val}</div></div>`;

    const n = q.monthly_allowed ? Number(q.payments_count) : 0;
    const ye = q.year_end_date ? fd(q.year_end_date) : 'your year end';
    const yeTotal = sum(G.year_end, l => l.total), msTotal = sum(G.monthly, l => l.total);
    const yePm = n ? down(yeTotal, n) : 0, msPm = n ? down(msTotal, n) : 0;
    const catchTotal = sum(G.catch_up, l => l.total);
    let k = 0, html = '';

    // Header block
    const preparedFor = c.client_type === 'ltd'
      ? `${esc(c.contact)}, Director<br>${esc(c.company_name || c.name)}${c.crn ? `<br>Company number ${esc(c.crn)}` : ''}`
      : `${esc(c.contact)}${c.trading_name ? `<br>${esc(c.trading_name)}` : ''}`;
    html += `<h1 class="title">QUOTE</h1>
      <div class="meta">
        <div><b>Prepared for</b><div>${preparedFor}</div></div>
        <div><div><b>Date:</b> ${esc(fd(q.sent_at || q.created_at))}</div><div><b>Quote reference:</b> ${esc(q.quote_number)}</div>
          ${q.expires_at ? `<div><b>Valid until:</b> ${esc(fd(q.expires_at))}</div>` : ''}
          ${q.year_end_date ? `<div><b>Period:</b> to ${esc(ye)}</div>` : ''}</div>
      </div>`;

    if (G.catch_up.length) {
      const ch = catchHead(G.catch_up); hidePeriod = ch.hide;
      html += `<section class="sec"><h2>${++k}. Catch-up work (one-off)${esc(ch.suffix)}</h2>
        ${G.catch_up.map(l => row(l, l.total, l.gross)).join('')}
        ${tot('Total catch-up work (paid once)', money(catchTotal))}</section>`;
    }
    if (G.sa.length) {
      html += `<section class="sec"><h2>${++k}. Self Assessment</h2>
        ${G.sa.map(l => row(l, l.total, l.gross, '', `${money(l.deposit)} when you accept, ${money(l.balance)} before we submit your return to HMRC`)).join('')}
        ${tot('Paid when you accept', money(sum(G.sa, l => l.deposit)))}
        ${Number(q.balance_later) ? tot('Balance before submission', money(q.balance_later)) : ''}</section>`;
    }
    if (G.year_end.length) {
      html += `<section class="sec"><h2>${++k}. Year-end services${esc(yeHead())}</h2>
        ${G.year_end.map(l => row(l, l.total, l.gross)).join('')}
        ${tot('Total year-end services', money(yeTotal))}
        ${n ? tot(`Spread over ${n} month${n === 1 ? '' : 's'}`, money(yePm) + ' a month') : ''}</section>`;
    }
    if (G.monthly.length) {
      const months = G.monthly[0].months;
      html += `<section class="sec"><h2>${++k}. Monthly services – ongoing</h2>
        ${months ? `<p class="sub">Until ${esc(ye)}${months > 1 ? ` (${months} months)` : ''}</p>` : ''}
        ${G.monthly.map(l => row(l, perMonth(l), l.months ? r2(Number(l.gross) / l.months) : l.gross, ' a month')).join('')}
        ${tot('Total monthly services', money(n ? msPm : (months ? r2(msTotal / months) : msTotal)) + ' a month')}</section>`;
    }

    // Monthly plans that run until the client cancels (e.g. MTD plans)
    const R = Number(q.rolling_monthly || 0) || sum(G.rolling, l => l.total);
    if (G.rolling.length) {
      html += `<section class="sec"><h2>${++k}. Monthly plan – until you cancel</h2>
        <p class="sub">Charged each month by card; not tied to your year end</p>
        ${G.rolling.map(l => row(l, l.total, l.gross, ' a month')).join('')}
        ${tot('Total monthly plan', money(R) + ' a month')}</section>`;
    }

    const ongoing = Number(q.ongoing_total);
    if (ongoing > 0 && n) {
      html += `<section class="sec"><h2>${++k}. Your monthly fee</h2>
        ${G.year_end.length ? `<div class="row"><div class="d">Year-end services (spread over ${n} months)</div><div class="a">${money(yePm)}</div></div>` : ''}
        ${G.monthly.length ? `<div class="row"><div class="d">Monthly services</div><div class="a">${money(msPm)}</div></div>` : ''}
        ${R ? `<div class="row"><div class="d">Monthly plan (until you cancel)</div><div class="a">${money(R)}</div></div>` : ''}
        <div class="band"><div>Total monthly fee<small>${n} payments, ${esc(fd(q.first_payment_date))} to ${esc(fd(q.last_payment_date))}${R ? `; then ${money(R)} a month until you cancel` : ''}</small></div><div class="a">${money(r2(Number(q.monthly_amount) + R))} a month</div></div>`;
    } else if (ongoing > 0) {
      html += `<section class="sec"><h2>${++k}. Your fee for ongoing services</h2>
        <div class="band"><div>Ongoing services (one payment)</div><div class="a">${money(ongoing)}</div></div>
        ${R ? `<div class="band"><div>Monthly plan<small>until you cancel</small></div><div class="a">${money(R)} a month</div></div>` : ''}`;
    } else if (R) {
      html += `<section class="sec"><h2>${++k}. Your monthly fee</h2>
        <div class="band"><div>Total monthly fee<small>until you cancel</small></div><div class="a">${money(R)} a month</div></div>`;
    } else html += `<section class="sec">`;
    if (catchTotal) html += `<div class="band">${'<div>One-off catch-up fee</div>'}<div class="a">${money(catchTotal)}</div></div>`;
    if (G.sa.length) html += `<div class="band alt"><div>Self Assessment – due when you accept<small>${money(q.balance_later)} balance before we submit your return</small></div><div class="a">${money(sum(G.sa, l => l.deposit))}</div></div>`;
    if (Number(q.discount_total)) html += `<p class="hint" style="margin-top:8px">These prices include a discount of ${money(q.discount_total)}${q.discount_reason ? ' (' + esc(q.discount_reason) + ')' : ''}, which applies until ${esc(ye)}.</p>`;
    html += `</section>`;

    // Pay in full or monthly
    const nowOneOff = Number(q.one_off_due_now);
    if (ongoing > 0 && n) {
      const restN = n - 1;
      html += `<section class="sec"><h2>How would you like to pay?</h2>
        <div class="choice" id="choice">
          <button type="button" class="opt" data-v="monthly"><span class="radio"></span><span><b>Pay monthly</b><span class="big">${money(nowOneOff + Number(q.monthly_amount) + R)} today</span>
            <small>then ${restN} monthly payment${restN === 1 ? '' : 's'} of ${money(r2(Number(q.monthly_amount) + R))}${R ? `, the last on ${esc(fd(q.last_payment_date))}; then ${money(R)} a month for your monthly plan until you cancel` : `. Payments stop automatically after ${esc(fd(q.last_payment_date))}`}.</small></span></button>
          <button type="button" class="opt" data-v="one_off"><span class="radio"></span><span><b>Pay the year in full</b><span class="big">${money(nowOneOff + ongoing + R)} today</span><small>${R ? `Year-end and monthly services paid in one go; your monthly plan continues at ${money(R)} a month until you cancel` : 'One card payment, nothing more to pay'}${Number(q.balance_later) ? ' (plus the Self Assessment balance)' : ''}.</small></span></button>
        </div></section>`;
    }

    if (q.message_to_client) html += `<section class="sec"><h2>Key information</h2><div class="msg">${esc(q.message_to_client)}</div></section>`;

    const notes = [
      `${esc(pr.name || 'Accounted4Tax Ltd')} is not VAT registered, so no VAT is added to these prices.`,
      'If the work needed changes (for example more employees or transactions, or extra services), we will tell you the cost before doing any extra work.',
    ];
    if (ongoing > 0 && n) notes.push('The monthly fee is collected automatically each month by card through Stripe and stops after the last payment.');
    if (R) notes.push(`Your monthly plan (${money(R)} a month) is collected by card through Stripe each month and continues until you cancel, as set out in our engagement letter.`);
    if (Number(q.balance_later)) notes.push('The Self Assessment balance is taken from the same card before we submit your return to HMRC.');
    notes.push(`${q.expires_at ? `This quote is valid until ${esc(fd(q.expires_at))}. ` : ''}Click “Accept this quote” to read and sign our engagement letter and pay securely online.`);
    html += `<section class="sec"><h2>Notes</h2><ul class="notes">${notes.map(x => `<li>${x}</li>`).join('')}</ul></section>`;

    html += `<div class="accept"><button type="button" class="btn btn-teal" id="go" disabled>Accept this quote</button>
      <p id="go-hint">${ongoing > 0 && n ? 'Choose how you would like to pay first.' : ''}</p>
      <p>Online acceptance is being finalised. To go ahead now, reply to our email${phone ? ' or call ' + esc(phone) : ''}.</p></div>`;
    $('main').innerHTML = html;

    const ch = $('choice');
    if (ch) ch.onclick = (e) => {
      const b = e.target.closest('[data-v]'); if (!b) return;
      ch.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b));
      try { sessionStorage.setItem('a4t-pay-' + token.slice(0, 12), b.dataset.v); } catch (_) {}
      $('go-hint').textContent = '';
    };
  })();
  </script>
</body>
</html>
