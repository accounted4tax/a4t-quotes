# Deploys Supabase Edge Functions automatically when their files change on main (added 24 Nov 2026).
# Only the functions whose files changed are deployed. verify_jwt per function: supabase/functions/verify_jwt.json.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access tokens). No other secrets here.
# Run by hand: Actions → "Deploy Supabase functions" → Run workflow → function names (space-separated).
name: Deploy Supabase functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
    inputs:
      functions:
        description: 'Function names to deploy, separated by spaces'
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: luctaleodfjrrtubqble
      MANUAL_LIST: ${{ github.event.inputs.functions }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Deploy the changed functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret"; exit 1; fi
          if [ -n "$MANUAL_LIST" ]; then list="$MANUAL_LIST"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then list=""
          else list=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- supabase/functions | awk -F/ 'NF>3{print $3}' | sort -u); fi
          echo "Functions: ${list:-none}"
          for f in $list; do
            case "$f" in *[!a-z0-9-]*) echo "::error::bad name $f"; exit 1;; esac
            [ -f "supabase/functions/$f/index.ts" ] || { echo "skip $f (no index.ts)"; continue; }
            jwt=$(jq -r --arg f "$f" 'if has($f) then .[$f] else "missing" end' supabase/functions/verify_jwt.json)
            if [ "$jwt" = missing ]; then echo "::error::$f is not in supabase/functions/verify_jwt.json"; exit 1; fi
            flag=""; [ "$jwt" = "false" ] && flag="--no-verify-jwt"
            echo "::group::$f (verify_jwt=$jwt)"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" $flag --use-api
            echo "::endgroup::"
          done
