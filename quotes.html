<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Quotes · A4T Quotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css?v=11">
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">A4</div><div class="brand-name">A4T Quotes</div></div>
    <button id="signout" class="btn btn-ghost" type="button">Sign out</button>
  </header>
  <nav class="bottom-nav" id="nav"></nav>
  <main>
    <div class="page-head"><h1>Quotes</h1><p>Every quote you have created, newest first.</p></div>
    <div id="err" class="alert alert-error" role="alert"></div>
    <div class="toolbar">
      <a class="btn btn-gold" href="quote.html">+ New quote</a>
    </div>
    <div class="toolbar"><div class="seg" id="filter" style="flex-wrap:wrap">
      <button type="button" data-f="all" class="on">All</button>
      <button type="button" data-f="draft">Draft</button>
      <button type="button" data-f="open">Sent / viewed</button>
      <button type="button" data-f="won">Accepted / paid</button>
      <button type="button" data-f="lost">Expired / declined</button>
    </div></div>
    <div id="list"><p class="empty">Loading…</p></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=11"></script>
  <script src="assets/js/app.js?v=11"></script>
  <script>
  (async function () {
    const session = await A4T.requireAdmin();
    if (!session) return;
    document.getElementById('signout').onclick = A4T.signOut;
    A4T.nav('quotes');
    const $ = (id) => document.getElementById(id), esc = A4T.esc;
    const GROUP = { draft: ['draft'], open: ['sent', 'viewed'], won: ['accepted', 'paid'], lost: ['expired', 'declined'] };
    const TXT = { draft: 'Draft', sent: 'Sent', viewed: 'Viewed', accepted: 'Accepted', paid: 'Paid', expired: 'Expired', declined: 'Declined' };
    let quotes = [], filter = new URLSearchParams(location.search).get('f') || 'all';
    const { data, error } = await A4T.sb.from('qs_quotes').select('id,quote_number,status,version,total,monthly_amount,payments_count,created_at,sent_at,expires_at,client:clients(full_name,company_name,client_type)').order('created_at', { ascending: false });
    if (error) { $('err').textContent = 'Could not load quotes: ' + error.message; $('err').classList.add('show'); return; }
    quotes = data;
    function render() {
      document.querySelectorAll('#filter button').forEach(b => b.classList.toggle('on', b.dataset.f === filter));
      const shown = quotes.filter(q => filter === 'all' || GROUP[filter].includes(q.status));
      if (!shown.length) { $('list').innerHTML = `<p class="empty">${quotes.length ? 'No quotes in this group.' : 'No quotes yet. Tap “New quote”.'}</p>`; return; }
      $('list').innerHTML = shown.map(q => {
        const c = q.client || {}; const who = c.client_type === 'ltd' ? c.company_name : c.full_name;
        return `<a class="svc" href="quote.html?id=${q.id}" style="text-decoration:none;color:inherit">
          <div class="svc-main"><div class="svc-name">${esc(who || '—')}</div>
            <div class="svc-meta">${esc(q.quote_number)} · v${q.version} · ${q.sent_at ? 'sent ' + esc(A4T.fmtDate(q.sent_at)) : 'created ' + esc(A4T.fmtDate(q.created_at))}${q.expires_at && ['sent','viewed'].includes(q.status) ? ' · valid until ' + esc(A4T.fmtDate(q.expires_at)) : ''}</div>
            <div class="svc-meta"><span class="status-chip st-${q.status}">${TXT[q.status]}</span></div></div>
          <div class="svc-price">${A4T.money(q.total)}${q.monthly_amount ? `<small>or ${A4T.money(q.monthly_amount)} × ${q.payments_count}</small>` : ''}</div></a>`;
      }).join('');
    }
    $('filter').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.f; render(); };
    render();
  })();
  </script>
</body>
</html>
