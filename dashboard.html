<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard · A4T Quotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css?v=8">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">A4</div>
      <div class="brand-name">A4T Quotes <span id="mode" class="mode-badge"></span></div>
    </div>
    <button id="signout" class="btn btn-ghost" type="button">Sign out</button>
  </header>

  <nav class="bottom-nav" id="nav"></nav>

  <main>
    <div class="page-head">
      <h1 id="greeting">Dashboard</h1>
      <p id="who"></p>
    </div>

    <div id="err" class="alert alert-error" role="alert"></div>

    <div class="toolbar"><a class="btn btn-gold" href="quote.html">+ New quote</a><a class="btn btn-ghost" href="clients.html">Clients</a></div>
    <section class="card">
      <h2>Quotes</h2>
      <div id="stats" class="stat-grid"></div>
    </section>

    <section class="card">
      <h2>Company lookup</h2>
      <p style="color:var(--muted);font-size:.9rem;margin-bottom:10px">Type a company name or number. This is how the Clients page will fill in Ltd details.</p>
      <div class="ta">
        <input id="co-q" type="text" autocomplete="off" placeholder="e.g. Accounted 4 Tax or 16438537" aria-label="Company name or number">
        <div class="ta-list" id="co-list" role="listbox"></div>
      </div>
      <div id="co-out"></div>
    </section>

    <section class="card">
      <h2>System check</h2>
      <ul id="checks" class="check-list"></ul>
    </section>

    <p style="text-align:center;font-size:.8rem;color:var(--muted)" id="ver"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=8"></script>
  <script src="assets/js/app.js?v=8"></script>
  <script>
    (async function () {
      const session = await A4T.requireAdmin();
      if (!session) return;

      document.getElementById('signout').onclick = A4T.signOut;
      A4T.nav('dashboard');
      document.getElementById('ver').textContent = A4T_CONFIG.APP_VERSION;
      const h = new Date().getHours();
      document.getElementById('greeting').textContent = (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + ', Eduard';
      document.getElementById('who').textContent = 'Signed in as ' + session.user.email;

      const checks = [];
      const addCheck = (state, text) => checks.push(`<li><span class="dot ${state}"></span><span>${A4T.esc(text)}</span></li>`);

      // Settings (also proves the database + security rules work)
      const { data: settings, error: sErr } = await A4T.sb.from('qs_settings').select('key,value');
      if (sErr) {
        const e = document.getElementById('err'); e.textContent = 'Could not reach the database: ' + sErr.message; e.classList.add('show');
        addCheck('bad', 'Database connection failed');
      } else {
        const map = Object.fromEntries(settings.map(s => [s.key, s.value]));
        const mode = map.stripe_mode === 'live' ? 'live' : 'test';
        const badge = document.getElementById('mode');
        badge.textContent = mode.toUpperCase();
        badge.className = 'mode-badge mode-' + mode;
        addCheck('ok', `Database connected (${settings.length} settings loaded)`);
        addCheck('ok', 'Admin login and security rules working');
        addCheck(mode === 'live' ? 'ok' : 'todo', `Stripe mode: ${mode.toUpperCase()}`);
      }

      // Quote counts by status
      const statuses = ['draft', 'sent', 'viewed', 'accepted', 'paid', 'expired', 'declined'];
      const { data: quotes } = await A4T.sb.from('qs_quotes').select('status');
      const counts = Object.fromEntries(statuses.map(s => [s, 0]));
      (quotes || []).forEach(q => { counts[q.status] = (counts[q.status] || 0) + 1; });
      document.getElementById('stats').innerHTML = statuses.map(s =>
        `<a class="stat s-${s}" href="quotes.html?f=${{draft:'draft',sent:'open',viewed:'open',accepted:'won',paid:'won',expired:'lost',declined:'lost'}[s]}" style="text-decoration:none;color:inherit"><div class="n">${counts[s]}</div><div class="l">${s}</div></a>`).join('');

      checks.push(`<li id="ch-row"><span class="dot todo" id="ch-dot"></span><span style="flex:1"><span id="ch-text">Companies House lookup</span></span><button type="button" class="btn btn-ghost btn-sm" id="ch-test">Test</button></li>`);
      addCheck('ok', 'Services & pricing catalogue (Phase 3)');
      checks.push(`<li><span class="dot todo" id="em-dot"></span><span style="flex:1" id="em-text">Email sending (Brevo)</span><button type="button" class="btn btn-ghost btn-sm" id="em-test">Send test email</button></li>`);
      addCheck('ok', 'Quote builder, client quote page and quote emails (Phase 4)');
      document.getElementById('checks').innerHTML = checks.join('');

      // ---------- Company lookup (type-ahead) ----------
      (function () {
        const q = document.getElementById('co-q'), list = document.getElementById('co-list'), out = document.getElementById('co-out');
        const esc = A4T.esc;
        const fmt = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
        const dob = (d) => d ? new Date(Date.UTC(d.year, d.month - 1, 1)).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }) : '';
        let timer = null, seq = 0, results = [], hl = -1;

        async function call(body) {
          const res = await A4T.sb.functions.invoke('companies-house-lookup', { body });
          if (res.error) {
            let msg = res.error.message;
            try { const b = await res.error.context.json(); if (b.error) msg = b.error.message; } catch (_) {}
            throw new Error(msg);
          }
          return res.data;
        }
        function close() { list.classList.remove('open'); hl = -1; }
        function renderList() {
          if (!results.length) { list.innerHTML = '<div class="ta-item"><span>No companies found</span></div>'; list.classList.add('open'); return; }
          list.innerHTML = results.map((r, i) => `<div class="ta-item ${i === hl ? 'hl' : ''}" data-i="${i}" role="option">
            <b>${esc(r.company_name)}</b>
            <span>${esc(r.company_number)} · <span class="${r.company_status === 'active' ? '' : 'st-dissolved'}">${esc(r.company_status || '')}</span>${r.address_snippet ? ' · ' + esc(r.address_snippet) : ''}</span></div>`).join('');
          list.classList.add('open');
        }
        q.addEventListener('input', () => {
          clearTimeout(timer);
          const v = q.value.trim();
          if (v.length < 2) { close(); return; }
          timer = setTimeout(async () => {
            const my = ++seq;
            try {
              const looksLikeNumber = /^([A-Za-z]{2})?\d{6,8}$/.test(v.replace(/\s/g, ''));
              if (looksLikeNumber) { close(); return pick(v); }
              const d = await call({ search: v });
              if (my !== seq) return;
              results = d.results || []; hl = -1; renderList();
            } catch (e) { list.innerHTML = `<div class="ta-item"><span class="warn">${esc(e.message)}</span></div>`; list.classList.add('open'); }
          }, 350);
        });
        q.addEventListener('keydown', (e) => {
          if (!list.classList.contains('open') || !results.length) return;
          if (e.key === 'ArrowDown') { hl = Math.min(hl + 1, results.length - 1); renderList(); e.preventDefault(); }
          else if (e.key === 'ArrowUp') { hl = Math.max(hl - 1, 0); renderList(); e.preventDefault(); }
          else if (e.key === 'Enter' && hl >= 0) { e.preventDefault(); choose(hl); }
          else if (e.key === 'Escape') close();
        });
        list.addEventListener('click', (e) => { const it = e.target.closest('[data-i]'); if (it) choose(Number(it.dataset.i)); });
        document.addEventListener('click', (e) => { if (!e.target.closest('.ta')) close(); });
        function choose(i) { const r = results[i]; close(); q.value = r.company_name; pick(r.company_number); }

        async function pick(number) {
          out.innerHTML = '<p style="color:var(--muted);margin-top:12px">Loading company details…</p>';
          try {
            const c = await call({ company_number: number });
            const person = (p, extra) => `<div class="person"><b>${esc(p.name)}</b>${extra}
              <small>${p.date_of_birth ? 'Born ' + esc(dob(p.date_of_birth)) + ' · ' : ''}${esc(p.nationality || '')}${p.country_of_residence ? ' · lives in ' + esc(p.country_of_residence) : ''}</small>
              <small>Service address: ${esc(p.address.single_line || '—')}</small></div>`;
            const os = c.outstanding_accounts || [];
            out.innerHTML = `<div class="co-block">
              <h3>Company</h3>
              <dl class="kv">
                <dt>Name</dt><dd><b>${esc(c.company_name)}</b></dd>
                <dt>Number</dt><dd>${esc(c.company_number)}</dd>
                <dt>Status</dt><dd class="${c.company_status === 'active' ? '' : 'warn'}">${esc(c.company_status)}</dd>
                <dt>Registered office</dt><dd>${esc(c.registered_office.single_line)}</dd>
                <dt>Year end</dt><dd>${esc(c.accounting_reference_date.label || '—')} · current year end <b>${esc(fmt(c.upcoming_year_end))}</b></dd>
                <dt>Outstanding accounts</dt><dd>${os.length ? os.map(p => `period to ${esc(fmt(p.period_end))}, due ${esc(fmt(p.due_date))}${p.overdue ? ' <span class="warn">OVERDUE</span>' : ''}`).join('<br>') : 'None'}</dd>
                <dt>Confirmation stmt</dt><dd>due ${esc(fmt(c.confirmation_statement_due_date))}${c.confirmation_statement_overdue ? ' <span class="warn">OVERDUE</span>' : ''}</dd>
              </dl>
              <h3>Officers (${c.officers.length})</h3>
              ${c.officers.map(o => person(o, ` <small>${esc(String(o.role || '').replace(/-/g, ' '))} since ${esc(fmt(o.appointed_on))}</small>`)).join('') || '<p>None listed</p>'}
              <h3>People with significant control (${c.pscs.length})</h3>
              ${c.pscs.map(p => person(p, `<small>${esc(p.control_summary.join('; '))}</small>`)).join('') || '<p>None listed</p>'}
              <p class="hint">Companies House only shows service addresses. Home addresses come from the client's AML documents.</p>
            </div>`;
          } catch (e) { out.innerHTML = `<p class="warn" style="margin-top:12px">${esc(e.message)}</p>`; }
        }
      })();

      // Brevo test email
      document.getElementById('em-test').onclick = async () => {
        const btn = document.getElementById('em-test'), dot = document.getElementById('em-dot'), txt = document.getElementById('em-text');
        btn.disabled = true; btn.textContent = 'Sending…';
        let err = null, data = null;
        try {
          const res = await A4T.sb.functions.invoke('send-email', { body: { test: true } });
          data = res.data;
          if (res.error) { try { const b = await res.error.context.json(); err = b.error ? b.error.message : res.error.message; } catch (_) { err = res.error.message; } }
        } catch (e) { err = e.message; }
        if (data && data.sent) { dot.className = 'dot ok'; txt.textContent = `Test email sent to ${data.to}. Check it arrived in your inbox, not spam.`; }
        else { dot.className = 'dot bad'; txt.textContent = 'Email failed: ' + (err || 'unknown error'); }
        btn.disabled = false; btn.textContent = 'Send again';
      };

      // Companies House lookup self-test (uses Accounted4Tax Ltd, 16438537)
      document.getElementById('ch-test').onclick = async () => {
        const btn = document.getElementById('ch-test'), dot = document.getElementById('ch-dot'), txt = document.getElementById('ch-text');
        btn.disabled = true; btn.textContent = 'Testing…'; txt.textContent = 'Companies House lookup: checking…';
        let data = null, err = null;
        try {
          const res = await A4T.sb.functions.invoke('companies-house-lookup', { body: { company_number: '16438537' } });
          data = res.data;
          if (res.error) {
            try { const body = await res.error.context.json(); err = body.error ? body.error.message : res.error.message; }
            catch (_) { err = res.error.message; }
          }
        } catch (e) { err = e.message; }
        if (data && data.company_name) {
          dot.className = 'dot ok';
          const fmt = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
          const os = data.outstanding_accounts || [];
          const osTxt = os.length ? `Outstanding accounts (catch-up): ${os.map(p => `period to ${fmt(p.period_end)}, due ${fmt(p.due_date)}${p.overdue ? ' OVERDUE' : ''}`).join('; ')}` : 'No outstanding accounts';
          txt.innerHTML = `Companies House lookup working: <b>${A4T.esc(data.company_name)}</b> (${A4T.esc(data.company_status || '')}). Current year end (monthly services) ${A4T.esc(fmt(data.upcoming_year_end))}. ${A4T.esc(osTxt)}. ${data.officers.length} officer${data.officers.length === 1 ? '' : 's'}.`;
        } else {
          dot.className = 'dot bad';
          txt.textContent = 'Companies House lookup failed: ' + (err || 'no data returned');
        }
        btn.disabled = false; btn.textContent = 'Test again';
      };
    })();
  </script>
</body>
</html>
